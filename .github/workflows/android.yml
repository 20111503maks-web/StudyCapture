name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Unit tests (pure Kotlin modules)
        run: ./gradlew :core:model:test :core:srs:test :core:understanding:test --stacktrace

      - name: Build debug APK and run app unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      # Unsigned release build so R8/shrinking problems show up on every push, not first at release time.
      - name: Build release (R8 check)
        run: ./gradlew :app:assembleRelease --stacktrace

      # The main privacy promise: the APK must not be able to use the network.
      - name: Assert APK has no network permissions
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          PERMS=$("$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk)
          echo "$PERMS"
          if echo "$PERMS" | grep -qE 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)'; then
            echo "::error::Network permission found in the APK"
            exit 1
          fi

      - name: Upload APK (debug build, for testers)
        uses: actions/upload-artifact@v7
        with:
          name: StudyCapture-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
