name: Release APK

# Push a tag like v0.1.0 to publish a downloadable test APK on the Releases page.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:srs:test :core:understanding:test :app:assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk StudyCapture-${{ github.ref_name }}-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: StudyCapture-${{ github.ref_name }}-debug.apk
          prerelease: true
          body: |
            Test build (debug-signed). Install on Android 9+ by opening the APK on the phone
            and allowing installs from this source. Not for Google Play.
